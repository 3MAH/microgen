name: Gallery render diagnosis

# Builds the documentation exactly as build-docs.yml does, but executes only the
# gallery examples selected by `examples`, under several OpenGL set-ups. Each
# variant uploads the gallery images it produced and logs the rendering stack,
# so that blank images can be traced to one set-up. Nothing is deployed.

on:
  # A workflow_dispatch workflow can only be started by hand once it is on the
  # default branch; until then, pushing this branch runs it.
  push:
    branches: [ci/gallery-render-diagnosis]
  workflow_dispatch:
    inputs:
      examples:
        description: "Regular expression on the example paths to execute"
        default: '3Doperations/(voronoi|raster_ellipsoid)\.py'

jobs:
  render:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same set-up as build-docs.yml: Xvfb display, VTK default window.
          - variant: xvfb-default
            apt: ""
            env: ""
          # Mesa software rasteriser forced on the Xvfb display.
          - variant: xvfb-llvmpipe
            apt: ""
            env: "LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe"
          # Older Mesa software rasteriser.
          - variant: xvfb-softpipe
            apt: ""
            env: "LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=softpipe"
          # VTK off-screen window through OSMesa, no X display involved.
          - variant: osmesa
            apt: "libosmesa6"
            env: "VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow"
          # VTK off-screen window through EGL (Mesa surfaceless platform).
          - variant: egl
            apt: "libegl1 libegl-mesa0"
            env: "VTK_DEFAULT_OPENGL_WINDOW=vtkEGLRenderWindow EGL_PLATFORM=surfaceless"
    env:
      PYVISTA_OFF_SCREEN: "True"
      ALLOW_PLOTTING: true
      MICROGEN_GALLERY_FILTER: ${{ inputs.examples || '3Doperations/(voronoi|raster_ellipsoid)\.py' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: pyvista/setup-headless-display-action@v3

      - name: Install libGLU, mesa-utils and the variant libraries
        run: sudo apt-get install -y libglu1-mesa mesa-utils ${{ matrix.apt }}

      - name: Set the variant environment
        if: matrix.env != ''
        run: |
          for assignment in ${{ matrix.env }}; do
            echo "$assignment" >> "$GITHUB_ENV"
          done

      - name: Install package with docs and CAD dependencies
        run: pip install .[docs,cad]

      - name: Log the rendering stack
        run: |
          glxinfo -B || true
          python -c "import pyvista; print(pyvista.Report(gpu=True))"

      - name: Build docs
        run: make -C docs html

      - name: Upload the gallery images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-${{ matrix.variant }}
          path: |
            docs/_build/html/_images/sphx_glr_*.png
          if-no-files-found: warn
