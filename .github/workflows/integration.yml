name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    # PR branches are already covered by `pull_request`; pushing to them
    # must not run the whole matrix a second time.
    branches: [main]

  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYVISTA_OFF_SCREEN: "True"

jobs:
  run-examples:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: pyvista/setup-headless-display-action@v3
      - uses: mamba-org/setup-micromamba@v2
        with:
          generate-run-shell: true
          micromamba-version: "2.0.4-0" # any version from https://github.com/mamba-org/micromamba-releases
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          init-shell: powershell bash
          download-micromamba: true
          cache-environment: true
          post-cleanup: "shell-init"

      # libosmesa6 gives VTK an off-screen fallback when a parallel example
      # cannot connect to the Xvfb display ("bad X server connection").
      - name: Install libglu1-mesa and libosmesa6 for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libglu1-mesa libosmesa6

      - name: Install microgen for Linux and macOS
        if: runner.os != 'Windows'
        run: |
          pip install uv
          uv pip install --system microgen@. --no-deps
        shell: micromamba-shell {0}

      - name: Examples on Linux and macOS with MMG
        if: runner.os != 'Windows'
        run: python examples/run_examples.py -n auto
        shell: micromamba-shell {0}

      - name: Install microgen for Windows
        if: runner.os == 'Windows'
        run: pip install . --no-deps
        shell: pwsh

      - name: Examples on Windows without MMG
        if: runner.os == 'Windows'
        run: python examples/run_examples.py --no-mmg -n auto
        shell: pwsh
